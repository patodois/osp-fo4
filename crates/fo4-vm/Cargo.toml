[package]
name = "fo4-vm"
description = "Small interpreter over compiled Fallout 4 scripts (.pex) under pending rules, with a recording host"
repository.workspace = true
keywords = ["fallout4", "bethesda", "scripts", "interpreter"]
categories = ["game-development"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fo4-core.workspace = true
fo4-pex = { path = "../fo4-pex" }
fo4-plugin.workspace = true
fo4-vfs.workspace = true

[dev-dependencies]
# Examples read voice file headers; the library takes the seconds from its caller.
fo4-audio = { path = "../fo4-audio" }
fo4-scene.workspace = true
